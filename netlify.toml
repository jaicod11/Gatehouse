# Netlify: builds the web app as a single-page app. Steps: docs/DEPLOYMENT.md.
# EXPO_PUBLIC_* variables are set in the Netlify UI and inlined into the bundle at build time.

[build]
  command = "npx expo export -p web"
  publish = "dist"

[build.environment]
  # Same major version as CI (.github/workflows/ci.yml).
  NODE_VERSION = "24"

# SPA fallback: any path without a file (/dashboard, /admin, /privacy, unknown URLs) gets
# index.html with a 200, and the client router takes over. Real files such as the JS bundle
# are never rewritten (Netlify doesn't shadow existing files unless forced with "200!").
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers on every response. No Content-Security-Policy yet: Google sign-in, Supabase
# and fonts make it easy to break; see "Known limitations" in the README.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Long-lived caching only for files whose names contain a content hash. index.html (and so every
# SPA route), favicon.ico and metadata.json keep Netlify's default, which revalidates each time.
# Cache-Control is set only here, never in the "/*" rule above, so rules never conflict.
[[headers]]
  for = "/_expo/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
